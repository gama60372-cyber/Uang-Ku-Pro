- name: Build APK
  run: |
    GRADLEW=$(find project -type f -name gradlew | head -n 1)

    if [ -z "$GRADLEW" ]; then
      echo "gradlew tidak ditemukan di ZIP"
      find project -maxdepth 3 -type f | head -100
      exit 1
    fi

    echo "gradlew ditemukan di: $GRADLEW"

    PROJECT_DIR=$(dirname "$GRADLEW")
    cd "$PROJECT_DIR"

    chmod +x gradlew
    ./gradlew assembleDebug
