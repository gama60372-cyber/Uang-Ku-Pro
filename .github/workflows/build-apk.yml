name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and extract ZIP
        run: |
          unzip -q *.zip -d project
          echo "Isi project:"
          find project -maxdepth 3 -type f | head -50

      - name: Build APK
        run: |
          GRADLEW=$(find project -type f -name gradlew | head -1)

          if [ -z "$GRADLEW" ]; then
            echo "gradlew tidak ditemukan di ZIP"
            exit 1
          fi

          echo "gradlew ditemukan di: $GRADLEW"

          PROJECT_DIR=$(dirname "$GRADLEW")
          cd "$PROJECT_DIR"

          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/build/outputs/apk/**/*.apk'
